<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Automation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>LinkedIn Auto Connect</h1>

      <div class="form-group">
        <label for="keyword">Palavra-chave:</label>
        <input
          type="text"
          id="keyword"
          placeholder="Ex: recruiter, tech recruiter"
        />
      </div>

      <div class="form-group">
        <label for="scrollAmount">Qtd. Scrolls:</label>
        <input type="number" id="scrollAmount" value="5" min="1" />
      </div>

      <div class="form-group">
        <label for="scrollDelay">Delay Scroll (ms):</label>
        <input type="number" id="scrollDelay" value="2000" min="500" />
      </div>

      <div class="form-group">
        <label for="clickDelay">Delay Clique (ms):</label>
        <input type="number" id="clickDelay" value="1500" min="500" />
      </div>

      <div class="actions">
        <button id="btnStart" class="btn primary">Iniciar</button>
        <button id="btnStop" class="btn danger" disabled>Parar</button>
      </div>

      <div id="status" class="status-box">Aguardando início...</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
